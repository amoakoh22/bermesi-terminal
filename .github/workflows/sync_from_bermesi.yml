name: Sync Bloomberg KPI Terminal from Bermesi

on:
  schedule:
    # Runs 5 minutes after Bermesi's dynamic slip-aware gates
    - cron: '45 0 * * *'
    - cron: '45 3 * * *'
    - cron: '15 4 * * *'
    - cron: '35 5 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bermesi-terminal
        uses: actions/checkout@v4

      - name: Pull latest dashboard/index.html from amoakoh22/Bermesi
        run: |
          curl -fsSL "https://raw.githubusercontent.com/amoakoh22/Bermesi/main/dashboard/index.html" -o index.html.tmp
          if [ -s index.html.tmp ] && grep -q "BERMESI" index.html.tmp; then
            mv index.html.tmp index.html
          else
            rm -f index.html.tmp
            echo "Invalid or empty dashboard fetched; skipping."
            exit 0
          fi

      - name: Commit and push if updated
        run: |
          git config user.name "Bermesi Terminal Sync"
          git config user.email "bermesi-bot@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-sync): sync live Bloomberg KPI terminal from amoakoh22/Bermesi"
            git push origin main
          else
            echo "Terminal already up to date."
          fi
